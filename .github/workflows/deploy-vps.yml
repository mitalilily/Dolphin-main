name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: dolphin-vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '72.60.96.97' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      PRIMARY_DOMAIN: ${{ secrets.PRIMARY_DOMAIN || 'shopnship.in' }}
      DOMAIN_NAMES: ${{ secrets.DOMAIN_NAMES || 'shopnship.in www.shopnship.in app.shopnship.in admin.shopnship.in api.shopnship.in' }}
      PUBLIC_ORIGIN: ${{ secrets.PUBLIC_ORIGIN || 'https://shopnship.in' }}
      USE_LOCAL_POSTGRES: ${{ secrets.USE_LOCAL_POSTGRES || 'true' }}
      APP_DIR: /var/www/dolphin
    steps:
      - name: Checkout deploy commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Deploy on VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${VPS_SSH_KEY:-}" ] && [ -z "${VPS_PASSWORD:-}" ]; then
            echo "Set VPS_SSH_KEY or VPS_PASSWORD in repository secrets." >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh_base=(
            -o StrictHostKeyChecking=accept-new
            -o IdentitiesOnly=yes
            -o ConnectTimeout=30
            -o ConnectionAttempts=3
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )
          ssh_target="${VPS_USER}@${VPS_HOST}"

          retry() {
            local attempt=1
            local max_attempts=3
            local delay_seconds=20

            until "$@"; do
              local exit_code=$?
              if [ "$attempt" -ge "$max_attempts" ]; then
                return "$exit_code"
              fi
              echo "Attempt ${attempt}/${max_attempts} failed; retrying in ${delay_seconds}s..."
              sleep "$delay_seconds"
              attempt=$((attempt + 1))
            done
          }

          echo "Checking ${VPS_HOST}:22 before deploy..."
          if timeout 15 bash -c "cat < /dev/null > /dev/tcp/${VPS_HOST}/22"; then
            echo "SSH port is reachable."
          else
            echo "::warning::SSH port ${VPS_HOST}:22 is not reachable from GitHub Actions right now."
          fi

          if ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y rsync
          fi

          if [ -n "${VPS_SSH_KEY:-}" ]; then
            printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/dolphin_vps
            chmod 600 ~/.ssh/dolphin_vps
            ssh_cmd=(ssh -i ~/.ssh/dolphin_vps "${ssh_base[@]}" "$ssh_target")
            rsync_ssh="ssh -i ~/.ssh/dolphin_vps ${ssh_base[*]}"
            rsync_cmd=(rsync -az --delete -e "$rsync_ssh")
          else
            sudo apt-get update
            sudo apt-get install -y sshpass
            ssh_cmd=(sshpass -p "$VPS_PASSWORD" ssh "${ssh_base[@]}" "$ssh_target")
            rsync_ssh="ssh ${ssh_base[*]}"
            rsync_cmd=(sshpass -p "$VPS_PASSWORD" rsync -az --delete -e "$rsync_ssh")
          fi

          retry "${ssh_cmd[@]}" "mkdir -p '${APP_DIR}' && (command -v rsync >/dev/null 2>&1 || (apt-get update && apt-get install -y rsync))"

          retry "${rsync_cmd[@]}" \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='apps/backend/node_modules/' \
            --exclude='apps/backend/dist/' \
            --exclude='apps/backend/.env' \
            --exclude='apps/backend/.env.production' \
            --exclude='apps/client/node_modules/' \
            --exclude='apps/client/dist/' \
            --exclude='apps/admin/node_modules/' \
            --exclude='apps/admin/build/' \
            ./ "$ssh_target:${APP_DIR}/"

          retry "${ssh_cmd[@]}" "cd '${APP_DIR}' && APP_DIR='${APP_DIR}' PRIMARY_DOMAIN='${PRIMARY_DOMAIN}' DOMAIN_NAMES='${DOMAIN_NAMES}' PUBLIC_ORIGIN='${PUBLIC_ORIGIN}' USE_LOCAL_POSTGRES='${USE_LOCAL_POSTGRES}' SKIP_DEPLOY_GIT_SYNC=true DEPLOY_COMMIT='${GITHUB_SHA}' bash scripts/vps/deploy.sh"
