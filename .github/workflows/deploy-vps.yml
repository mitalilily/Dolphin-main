name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '72.60.96.97' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      PUBLIC_ORIGIN: ${{ secrets.PUBLIC_ORIGIN || 'https://dolphinenterprises.in' }}
      APP_DIR: /var/www/dolphin
    steps:
      - name: Deploy on VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${VPS_SSH_KEY:-}" ] && [ -z "${VPS_PASSWORD:-}" ]; then
            echo "Set VPS_SSH_KEY or VPS_PASSWORD in repository secrets." >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh_base=(-o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes)
          ssh_target="${VPS_USER}@${VPS_HOST}"

          if [ -n "${VPS_SSH_KEY:-}" ]; then
            printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/dolphin_vps
            chmod 600 ~/.ssh/dolphin_vps
            ssh_cmd=(ssh -i ~/.ssh/dolphin_vps "${ssh_base[@]}" "$ssh_target")
          else
            sudo apt-get update
            sudo apt-get install -y sshpass
            ssh_cmd=(sshpass -p "$VPS_PASSWORD" ssh "${ssh_base[@]}" "$ssh_target")
          fi

          cat > /tmp/dolphin-deploy.sh <<'REMOTE'
          set -euo pipefail
          cd "${APP_DIR:-/var/www/dolphin}"
          git fetch --prune origin "+refs/heads/main:refs/remotes/origin/main"
          git reset --hard origin/main
          git show -s --oneline --decorate HEAD
          bash scripts/vps/deploy.sh
          REMOTE

          "${ssh_cmd[@]}" "APP_DIR='${APP_DIR}' PUBLIC_ORIGIN='${PUBLIC_ORIGIN}' bash -s" < /tmp/dolphin-deploy.sh
