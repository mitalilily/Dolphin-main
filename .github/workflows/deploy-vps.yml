name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: dolphin-vps-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '72.60.96.97' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      DEPLOY_SHA: ${{ github.sha }}
      PUBLIC_ORIGIN: ${{ secrets.PUBLIC_ORIGIN || 'https://shopnship.in' }}
      CLIENT_ORIGIN: ${{ secrets.CLIENT_ORIGIN || 'https://client.shopnship.in' }}
      CLIENT_DOMAIN: ${{ secrets.CLIENT_DOMAIN || 'client.shopnship.in' }}
      CLIENT_EXTRA_DOMAINS: ${{ secrets.CLIENT_EXTRA_DOMAINS || 'app.shopnship.in' }}
      ADMIN_ORIGIN: ${{ secrets.ADMIN_ORIGIN || 'https://admin.shopnship.in' }}
      API_ORIGIN: ${{ secrets.API_ORIGIN || 'https://api.shopnship.in' }}
      APP_DIR: /var/www/dolphin
    steps:
      - name: Deploy on VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${VPS_SSH_KEY:-}" ] && [ -z "${VPS_PASSWORD:-}" ]; then
            echo "Set VPS_SSH_KEY or VPS_PASSWORD in repository secrets." >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh_base=(-o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes)
          ssh_target="${VPS_USER}@${VPS_HOST}"

          if [ -n "${VPS_SSH_KEY:-}" ]; then
            printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/dolphin_vps
            chmod 600 ~/.ssh/dolphin_vps
            ssh_cmd=(ssh -i ~/.ssh/dolphin_vps "${ssh_base[@]}" "$ssh_target")
          else
            sudo apt-get update
            sudo apt-get install -y sshpass
            ssh_cmd=(sshpass -p "$VPS_PASSWORD" ssh "${ssh_base[@]}" "$ssh_target")
          fi

          cat > /tmp/dolphin-deploy.sh <<'REMOTE'
          set -euo pipefail
          app_dir="${APP_DIR:-/var/www/dolphin}"
          deploy_sha="${DEPLOY_SHA:-}"
          lock_file="${DEPLOY_LOCK_FILE:-/tmp/dolphin-deploy.lock}"
          lock_timeout="${DEPLOY_LOCK_TIMEOUT_SECONDS:-1800}"
          repo_url="https://github.com/mitalilily/Dolphin-main.git"
          exec 9>"$lock_file"
          echo "Waiting for deploy lock at $lock_file..."
          if ! flock -w "$lock_timeout" 9; then
            echo "Another deploy is still running after ${lock_timeout}s; aborting." >&2
            exit 1
          fi
          export DOLPHIN_DEPLOY_LOCK_HELD=1

          mkdir -p "$app_dir"
          cd "$app_dir"
          git config --global --add safe.directory "$app_dir" >/dev/null 2>&1 || true
          if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "Git checkout missing or invalid in $app_dir; restoring checkout."
            rm -rf .git
            git init
            git remote add origin "$repo_url"
          fi
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "$repo_url"
          else
            git remote add origin "$repo_url"
          fi
          git fetch --prune origin "+refs/heads/main:refs/remotes/origin/main"
          if [ -n "$deploy_sha" ]; then
            git reset --hard "$deploy_sha"
          else
            git reset --hard origin/main
          fi
          git show -s --oneline --decorate HEAD
          bash scripts/vps/deploy.sh

          if [ -n "$deploy_sha" ] && [ "$(git rev-parse HEAD)" != "$deploy_sha" ]; then
            echo "Deployed commit does not match GitHub Actions commit." >&2
            echo "Expected: $deploy_sha" >&2
            echo "Actual:   $(git rev-parse HEAD)" >&2
            exit 1
          fi

          curl -fsS "$API_ORIGIN/api/health" >/dev/null
          admin_headers="$(curl -fsSIL "$ADMIN_ORIGIN/" || true)"
          printf '%s\n' "$admin_headers" | grep -qi 'location: .*/auth/signin' || {
            echo "Admin root did not redirect to /auth/signin after deploy." >&2
            printf '%s\n' "$admin_headers" >&2
            exit 1
          }
          REMOTE

          set +e
          deploy_output="$("${ssh_cmd[@]}" "APP_DIR='${APP_DIR}' DEPLOY_SHA='${DEPLOY_SHA}' PUBLIC_ORIGIN='${PUBLIC_ORIGIN}' CLIENT_ORIGIN='${CLIENT_ORIGIN}' CLIENT_DOMAIN='${CLIENT_DOMAIN}' CLIENT_EXTRA_DOMAINS='${CLIENT_EXTRA_DOMAINS}' ADMIN_ORIGIN='${ADMIN_ORIGIN}' API_ORIGIN='${API_ORIGIN}' bash -s" < /tmp/dolphin-deploy.sh 2>&1)"
          deploy_status=$?
          set -e
          printf '%s\n' "$deploy_output"
          if [ "$deploy_status" -ne 0 ]; then
            deploy_error="$(printf '%s' "$deploy_output" | tail -c 900 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=VPS deploy failed::${deploy_error}"
            exit "$deploy_status"
          fi
